<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — HeartSeg AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <!-- Animated Background -->
  <canvas id="bg-canvas"></canvas>
  
  <!-- ECG Overlay -->
  <div class="ecg-line">
    <svg viewBox="0 0 1200 100" preserveAspectRatio="none">
      <path d="M0,50 L100,50 L120,20 L140,80 L160,10 L180,90 L200,50 L300,50 L320,20 L340,80 L360,10 L380,90 L400,50 L1200,50" 
            stroke="#ff4d6d" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Floating Particles Layer -->
  <div class="particles" id="particles"></div>

  <!-- Main Container -->
  <div class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <div class="brand">
        <div class="heart-logo">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4d6d" />
                <stop offset="100%" stop-color="#ff8fa3" />
              </linearGradient>
            </defs>
            <path d="M32 56S8 42 8 24c0-8.84 7.16-16 16-16 4.88 0 9.32 2.2 12.28 5.72C39.24 10.2 43.68 8 48.56 8 57.4 8 64.56 15.16 64.56 24c0 18-24 32-24 32z" 
                  stroke="url(#heartGrad)" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="32" cy="28" r="6" fill="#ff4d6d" opacity="0.3">
              <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </div>
        <h1 class="brand-title">HeartSeg<strong>AI</strong></h1>
        <p class="brand-sub">Cardiac MRI Analysis Platform</p>
      </div>

      <!-- Form -->
      <form method="POST" action="/login" class="login-form" id="login-form">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="field-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-pw" id="toggle-pw" onclick="togglePw()" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" name="remember" id="remember">
            <span class="checkmark"></span>
            <span class="label-text">Keep me signed in</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Sign In to Platform</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
          <div class="btn-loader">
            <div class="spinner"></div>
          </div>
        </button>
      </form>

      <div class="login-footer">
        <a href="/" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
          Back to HeartSeg AI
        </a>
        <p class="secure-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          HIPAA-compliant secure access
        </p>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
